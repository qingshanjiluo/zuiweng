name: chunshui-daily
on:
  schedule:
    - cron: '10 0 * * *'     # 每天 00:10 UTC (北京 08:10)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/chunshui_daily.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}