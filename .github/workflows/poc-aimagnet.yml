name: poc-aimagnet
on:
  workflow_dispatch:
  push:
    paths: ['scripts/aimagnet_poc.py', '.github/workflows/poc-aimagnet.yml']

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/aimagnet_poc.py