name: chunshui-register
on:
  workflow_dispatch:
    inputs:
      count:
        description: '本轮注册数量'
        required: false
        default: '5'
      interval_min:
        description: '每账号间隔(分钟)'
        required: false
        default: '1'

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/register_driver.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '5' }}