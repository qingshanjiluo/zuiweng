name: fengyue-daily
on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: '并行 job 数'
        required: false
        default: '4'

jobs:
  daily:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests curl_cffi
      - run: python scripts/daily_driver.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PLATFORM: fengyue
          SHARDS: ${{ github.event.inputs.shards || '4' }}
          SHARD: ${{ matrix.shard }}
          BATCH: '400'
          FY_CONCURRENCY: '3'