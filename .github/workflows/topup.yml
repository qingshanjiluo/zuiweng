name: topup
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests curl_cffi ddddocr
      - name: 启动机场代理
        run: |
          pip install pyyaml -q
          python scripts/proxy.py start
          echo "PROXY_URL=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "HTTP_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "NO_PROXY=zuiweng-api.workers.dev,mail.tm" >> $GITHUB_ENV
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
      - run: python scripts/topup_driver.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}