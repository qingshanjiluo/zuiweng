name: dzmm-daily
on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: pip install requests "curl_cffi==0.15.0"
      - run: python -c "from curl_cffi import requests; print('curl_cffi import OK')"
      - run: python scripts/daily_driver.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PLATFORM: dzmm