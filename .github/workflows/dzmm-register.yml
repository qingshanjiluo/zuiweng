name: dzmm-register
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '本轮注册量'
        required: false
        default: '20'
      shards:
        description: '并行 job 数'
        required: false
        default: '4'

jobs:
  register:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests curl_cffi playwright
      - run: python -m playwright install chromium --with-deps
      - run: python scripts/register_driver.py
        env:
          ZUIWENG_API: ${{ secrets.ZUIWENG_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '20' }}
          SHARDS: ${{ github.event.inputs.shards || '4' }}
          SHARD: ${{ matrix.shard }}
          PLATFORM: dzmm